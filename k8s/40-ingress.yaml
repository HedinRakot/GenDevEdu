apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devedu
  namespace: devedu
  labels: { app: devedu }
spec:
  # k3s ships Traefik as the default ingress controller.
  ingressClassName: traefik
  rules:
    - host: devedu.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
