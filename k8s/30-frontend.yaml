apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devedu
  labels: { app: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: localhost:5000/devedu/frontend:local
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_ADDR
              value: "backend:8080"      # k8s Service DNS within the namespace
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: devedu
  labels: { app: frontend }
spec:
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
